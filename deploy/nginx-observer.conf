# Add inside the TLS server for testnet.rhobot.net.
# The observer itself remains loopback-only; this is its read-only public surface.
location /observer/ {
    limit_except GET { deny all; }

    proxy_pass http://127.0.0.1:8088/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    # The edge owns these headers, including upstream failures and denials.
    # Hide upstream copies: duplicate Allow-Origin values break browser CORS.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
